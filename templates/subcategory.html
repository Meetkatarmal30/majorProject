<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ domain.name }} / Atlas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="shell">
    <nav class="topbar"><a class="brand" href="{{ url_for('domains') }}"><span class="brand-mark">+</span> ATLAS / 02</a><a class="back-link" href="{{ url_for('domains') }}">← All domains</a></nav>
    <section class="sub-intro section-pad"><div class="kicker">{{ domain.eyebrow }}</div><h1>{{ domain.name }}<span class="period">.</span></h1><p class="lede">{{ domain.description }}</p></section>
    <section class="subcategory-list section-pad">
      {% for slug, item in domain.subcategories.items() %}
      <a class="subcategory-row" href="{{ url_for('search', domain=domain_slug, subcategory=slug) }}">
        <span class="row-number">0{{ loop.index }}</span><span class="row-copy"><strong>{{ item.name }}</strong><small>{{ item.detail }}</small></span><span class="modality modality-{{ item.modality|lower }}">{{ item.modality }}</span><span class="row-arrow">↗</span>
      </a>
      {% endfor %}
    </section>
    <footer class="site-footer section-pad"><span>SELECT A USE CASE</span><span>{{ domain.subcategories|length }} PATHS AVAILABLE</span></footer>
  </main>
</body>
</html>
